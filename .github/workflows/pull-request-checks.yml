name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - prod

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This repository is public, so its jobs stay on GitHub-hosted runners. The self-hosted
    # nexus runner group admits only private repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Analytics tests
        run: npm run test:analytics
